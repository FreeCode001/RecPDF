[project]
name = "recpdf"
version = "0.1.0"
description = "Using large model to parse and translate PDF."
long_description = { file = "README.md" }
repository = "https://github.com/FreeCode001/RecPDF"
authors = [
    {name = "FreeCode001", email = "freecode0902@gmail.com"},
]
dependencies = ["python-dotenv>=1.2.1", "shapely>=2.1.2", "langchain>=1.2.8", "pymupdf>=1.26.7", "langchain-openai>=1.1.7"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
